<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowNet - Nova postagem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Nova publicação</h1>
        <form id="formPostagem">
            <textarea id="texto" placeholder="Escreva sua publicação..." maxlength="2000" required></textarea>
            <button type="submit">Publicar</button>
            <p id="mensagem" class="mensagem" role="alert"></p>
        </form>
        <a href="feed.html">Voltar para o feed</a>
    </div>
    <script src="js/api.js"></script>
    <script>
        obterUsuarioLogado().catch(() => window.location.href = 'login.html');
        document.getElementById('formPostagem').addEventListener('submit', async (event) => {
            event.preventDefault();
            const mensagem = document.getElementById('mensagem');
            mensagem.textContent = '';
            try {
                await apiRequest('publicacao', 'POST', { legenda: document.getElementById('texto').value.trim() });
                alert('Publicação criada!');
                window.location.href = 'feed.html';
            } catch (erro) {
                mensagem.textContent = erro.message;
            }
        });
    </script>
</body>
</html>
